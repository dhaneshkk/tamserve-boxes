# /etc/systemd/zram-generator.conf — compressed swap in RAM for a tamserve-boxes box.
#
# Detection runs on the CPU, so compression competes with inference for the same cores:
# lz4 compresses less than zstd but costs far less CPU. A quarter of RAM is enough for what
# actually compresses here (idle services, interpreter heaps, logs); the detector's own memory is
# kept out of swap by its service (MemorySwapMax=0, see deploy/systemd/tamserve-boxes.service).

[zram0]
zram-size = ram / 4
compression-algorithm = lz4
swap-priority = 100
