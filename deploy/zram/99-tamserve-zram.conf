# /etc/sysctl.d/99-tamserve-zram.conf — swap tuning for zram on a latency-sensitive detection box.
#
# swappiness 100 weighs swapping anonymous pages the same as dropping file cache. Desktops with
# zram often use 180, but that swaps too eagerly when a stalled page fault means a late frame.
vm.swappiness = 100
# Read one page per swap-in: zram has no seek cost, so read-ahead only wastes decompression.
vm.page-cluster = 0
