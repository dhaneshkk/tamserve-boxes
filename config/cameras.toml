# tamserve-boxes: one box's cameras. Passwords never go on a command line or into a URL:
# each comes from a file only this user can read (chmod 600), or from the environment.

[detector]
model = "yolox_nano_gray.onnx"   # tamserve-boxes fold yolox_nano.onnx yolox_nano_gray.onnx
threads = 3                      # OpenVINO threads: leave a core for decoding (4-core N100: 3)
requests = 2                     # inference requests in flight; a look's frames are split between them
classes = ["person", "car", "truck"]
# names = ["person", "helmet"]  # a fine-tuned model's classes, from its .names.json, if not COCO's

[tracker]
look_every = 3                   # frames between a camera's looks
hold = 30

[decode]
decoder = "vaapi"                # "auto", "software", or "vaapi" (H.264/H.265 on the integrated GPU)
width = 640                      # scale first; better still, point the URL at the camera's sub-stream
height = 360
stall_seconds = 10               # no frame for this long: reopen the stream
backoff_first = 1                # reconnect delays: 1 s, doubling to 30 s, with jitter
backoff_max = 30

[http]
listen = "127.0.0.1:9300"        # /metrics (Prometheus), /status, /v1/chat/completions (OpenAI-compatible)
# token_file = "/etc/tamserve/http.token"

[motion]                         # look only where something moves (and keep motion in recordings)
hold = 10                        # frames a camera stays awake after it last moved
# regions = true                 # crop looks around motion and what is followed: for main streams

# [light]                        # day/night and the IR switch; on with these defaults
# settle_seconds = 2             # after a switch, the camera is not looked at for this long (0: never)
# night_below = 2.0              # chroma below this looks like IR, above day_above like colour
# day_above = 4.0
# confirm = 5                    # frames in a row before day/night changes
# jump = 40                      # a brightness jump between frames that counts as a switch (0: off)

[record]
dir = "/var/lib/tamserve/recordings"
segment_seconds = 10
all_days = 1                     # every segment
motion_days = 3                  # with motion
objects_days = 14                # with any object
labels = { person = 30 }
max_gb = 400                     # over this, what would expire first goes first
# pins: /var/lib/tamserve/recordings/pins.json, [{"camera": "gate", "from": ms, "to": ms}]

[encode]                         # an AV1 uplink copy for cameras with `encode = true`, from detection's decode
encoder = "svtav1"               # "vah265": HEVC on the integrated GPU, almost no CPU; "x265": HEVC on the CPU
threads = 1                      # each encoder's threads: 20 encoders x 1 stays inside a 4-core budget
preset = 12                      # SVT-AV1: 10 to 12 for live CCTV on a small CPU
bitrate_kbps = 300               # low-delay CBR for the uplink; leave out for constant quality (crf = 40)
keyframe_seconds = 2
fps = 10                         # frames a second encoded; the decoder's others still go to detection
width = 640                      # the uplink can be smaller than what detection sees
height = 360
output = "/var/lib/tamserve/uplink/{camera}/%05d.mkv"   # Matroska segments, numbered on after a reconnect
segment_seconds = 60
max_files = 1440                 # a day of minute segments per camera

[[camera]]
name = "gate"
url = "rtsp://10.0.0.21/Streaming/Channels/102"
user = "viewer"
password_file = "/etc/tamserve/secrets/gate"
look_every = 1                   # this camera's own
record = true                    # to [record] dir, from this box's one connection
live = true                      # GET /live/gate.ts on [http]
encode = true                    # and the [encode] uplink copy
motion_mask = [[0.75, 0.0, 1.0, 0.08]]   # the clock overlay: no motion there

[[camera]]
name = "yard"
url = "rtsp://10.0.0.22/Streaming/Channels/102"
user = "viewer"
password_env = "YARD_PASSWORD"

# A camera found through ONVIF (feature onvif): its stream is looked up on the camera each time it is
# opened. `tamserve-boxes onvif --user viewer --password-file F` lists a network's cameras like this.
[[camera]]
name = "dock"
onvif = "10.0.0.23"              # or "http://10.0.0.23/onvif/device_service"
stream = "gray"                  # the smallest stream at least [decode] width wide, or a profile named gray
user = "viewer"
password_file = "/etc/tamserve/secrets/dock"

# [onvif]
# timeout_seconds = 5
# use_device_host = true         # reach streams at the address the camera was reached at, not the one it reports
# allow_username_token_over_http = false
# ca_file = "/etc/tamserve/site-ca.pem"   # https:// devices: a site CA, or the cameras' own certificates
