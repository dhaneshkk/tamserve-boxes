[package]
name = "tamserve-boxes"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Find and follow boxes on many CCTV cameras with YOLOX-Nano on gray frames, on the CPU through OpenVINO: GStreamer cameras, reconnects, health metrics and a coordinator for many boxes."
repository = "https://github.com/dhaneshkk/tamserve-boxes"

[features]
# fold: make the 1-channel model from YOLOX's own ONNX file (tamserve-boxes fold). Not needed to run one.
fold = ["dep:onnx-protobuf", "dep:protobuf"]
# cameras: read cameras in this process with GStreamer (RTSP, files; VA-API decoding where the box has it).
cameras = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:libc"]
# onvif: find cameras and their streams over ONVIF (Profile T, Media1 for older cameras): `onvif = "host"`
# in place of `url` in a camera's config, and `tamserve-boxes onvif` to list a network's cameras.
onvif = ["cameras", "dep:onvif-rs", "dep:onvif-schema", "dep:tokio", "dep:url", "dep:chrono", "dep:futures-util", "dep:reqwest"]
default = ["fold", "cameras", "onvif"]

[dependencies]
# OpenVINO's C library is loaded at run time: put its folder on LD_LIBRARY_PATH or set OPENVINO_INSTALL_DIR.
openvino = { version = "0.11.1", features = ["runtime-linking"] }
onnx-protobuf = { version = "0.2.3", optional = true }  # MPL-2.0
protobuf = { version = "=3.4.0", optional = true }  # the version onnx-protobuf's generated code was made with
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
libc = { version = "0.2", optional = true }  # SIGINT and SIGTERM, to close recordings whole; already under GStreamer
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
# ONVIF: dhaneshkk/onvif-rs with its review fixes (certificate checks, no UsernameToken over plain HTTP,
# safe redirects, bounded responses), pinned. Move to its main once fix/review-findings is merged.
onvif-rs = { package = "onvif", git = "https://github.com/dhaneshkk/onvif-rs", rev = "6399316ba8f50661287f0eb98cb188eede221886", features = ["tls"], optional = true }
onvif-schema = { package = "schema", git = "https://github.com/dhaneshkk/onvif-rs", rev = "6399316ba8f50661287f0eb98cb188eede221886", default-features = false, features = ["devicemgmt", "media", "media2"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"], optional = true }
url = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }  # onvif-rs's, for its Certificate type
fearless_simd = "1"
# IOGP Life-Saving Rule alerts (src/iogp.rs): the floor-plane scene graph in this repo, and the rule
# engine from iogp-editor, pinned to main after test1_logpeditor PR #2 (MIT).
vg360-scenegraph = { path = "vg360-scenegraph" }
iogp-runtime = { git = "https://github.com/dhaneshkk/test1_logpeditor", rev = "eaf4b262493e54870ab8c91e144bc13d393c1645" }
fearless_simd_macros = "0.1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
